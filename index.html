<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무위 無爲 : 물아일체</title>

<style>
/* ───── 가사 서체 : SM3견출명조 ─────
   fonts 폴더 안의 sm3gyeonchul.woff2 를 불러와서 사용
   → 폰트가 설치 안 된 컴퓨터(교수님 컴퓨터 등)에서도 똑같이 보임
   ※ 깃허브에 올릴 때 fonts 폴더도 꼭 같이 올리기! */
@font-face {
  font-family: 'SM3Gyeonchul';
  src: url('fonts/sm3gyeonchul.woff2') format('woff2');
  font-display: block;   /* 폰트 다 불러오기 전엔 다른 글꼴로 잠깐 바뀌어 보이지 않게 */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

img {
  user-select: none;
  -webkit-user-drag: none;
}


/* =========================================================
   1. 타이틀(로딩) 화면
   ========================================================= */
#intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #ffffff;
  cursor: pointer;
  transition: opacity 0.5s ease;
}

#intro img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#intro.gone {
  opacity: 0;
  pointer-events: none;
}


/* =========================================================
   2. 무대 — 그림 비율(2880 x 1800, 16:10) 그대로
      화면 안에 잘리지 않고 쏙 들어가게 맞춤 + 가운데 정렬
   ========================================================= */
.stage {
  position: relative;
  width:  min(100vw, calc(100vh * 2880 / 1800));
  height: min(100vh, calc(100vw * 1800 / 2880));
  container-type: size;
  overflow: hidden;
  background: #ffffff;
}

#room {
  position: absolute;
  inset: 0;
  z-index: 1;
}

.full {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ★ 흰 배경은 사라지고 선만 남게 (포토샵 '곱하기') */
.ink {
  mix-blend-mode: multiply;
}


/* ───── 서브 타이틀 ─────
   subtitle.png 도 같은 대지(2880x1800)에 그린 위치 그대로 올라감 */
#subtitle {
  z-index: 9;
}

/* ───── 인물 자세 (손머리 / 정자세 / 배에 손 / 배 긁기) ─────
   방 전체 그림 4장을 겹쳐두고 지금 자세 한 장만 보여줌 */
.pose {
  visibility: hidden;
}

.pose.on {
  visibility: visible;
}

/* ───── 표정 ─────
   얼굴(피부) 부분만 하얗게 덮고 → face.png 의 머리 부분만 위에 올림 */
#faceCover {
  position: absolute;
  inset: 0;
  background: #ffffff;
  pointer-events: none;
  clip-path: ellipse(3.4% 6.2% at 30.9% 54.2%);   /* 얼굴 피부 범위 */
  opacity: 0;
}

#faceImg {
  clip-path: inset(40% 63% 35.5% 20.8%);          /* face.png 에서 머리 + 표정 기호 부분만 */
  opacity: 0;
}

.angry #faceCover,
.angry #faceImg {
  opacity: 1;
}

.debug #faceCover {
  opacity: 1;
  background: rgba(40, 90, 255, 0.25);
}

/* ───── 이불 ───── */
.blanket {
  transition: opacity 0.6s ease;
}

/* 펼친 이불 밑을 하얗게 덮는 판 → 이불 아래 남자 다리가 안 보임
   (모양은 script 의 BLANKET_COVER 숫자, E 키로 직접 그려서 정할 수 있음) */
#blanketCover {
  position: absolute;
  inset: 0;
  background: #ffffff;
  pointer-events: none;
}

/* H 키 / E 키 누르면 덮개 범위가 파랗게 보임 */
.debug #blanketCover,
.editing #blanketCover {
  background: rgba(40, 90, 255, 0.25);
}

/* E 키 : 덮개 모양 그리기 모드 */
#editLayer {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: none;
  cursor: crosshair;
}

.editing #editLayer {
  display: block;
}

.dot {
  position: absolute;
  width: 10px;
  height: 10px;
  margin: -5px 0 0 -5px;
  border-radius: 50%;
  background: #2a5aff;
}

.blanket.off {
  opacity: 0;
}


/* ───── 담배 연기 ───── */
#smoke {
  z-index: 3;
  transform-origin: 55% 27.6%;   /* 담배 끝 위치 (흔들림 기준점) */
  animation: sway 3.4s ease-in-out infinite alternate;
  transition: filter 1.5s ease, scale 1.5s ease;
}

/* 노래에 담배가 나오는 대목 : 연기가 진하고 크게 */
#smoke.thick {
  filter: contrast(2.4);
  scale: 1.15;
}

#smoke img {
  opacity: 0;
  transition: opacity 0.45s ease;
}

#smoke img.on {
  opacity: 1;
}

@keyframes sway {
  0%   { transform: rotate(-1.2deg) skewX(-1.5deg); }
  100% { transform: rotate(1.2deg)  skewX(1.5deg); }
}


/* ───── 움직이는 소품 ───── */
.sprite {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}

.sprite .pic {
  width: 100%;
  height: 100%;
  background-repeat: no-repeat;
}

#roach    { z-index: 4; cursor: pointer; }
#mosquito { z-index: 8; cursor: pointer; }

#mosquito.hide {
  visibility: hidden;
}

/* 잡힌 모기 (납작) */
.corpse {
  z-index: 6;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.corpse .pic {
  animation: squash 0.25s ease-out forwards;
}

@keyframes squash {
  0%   { transform: scale(1, 1); }
  40%  { transform: scale(1.3, 0.6) rotate(8deg); }
  100% { transform: scale(1.15, 0.8) rotate(14deg); }
}

/* 피 터짐 */
.blood {
  z-index: 7;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.blood .pic {
  animation: splat 0.3s cubic-bezier(.2, 1.6, .4, 1) forwards;
}

@keyframes splat {
  0%   { transform: scale(0.3); }
  100% { transform: scale(1); }
}

.fade {
  opacity: 0 !important;
}

/* 탁! 화면 흔들림 */
.shake {
  animation: shake 0.18s linear;
}

@keyframes shake {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(-0.4%, 0.3%); }
  50%  { transform: translate(0.3%, -0.3%); }
  75%  { transform: translate(-0.2%, 0.2%); }
  100% { transform: translate(0, 0); }
}


/* ───── 컵 · 캔 : 그림에서 오려낸 조각 (마우스 올리면 들썩) ───── */
.patch {
  position: absolute;
  z-index: 2;
  background: #ffffff;           /* 원래 그림 자리를 가리는 흰 종이 */
  pointer-events: none;
}

.cut {
  position: absolute;
  z-index: 2;
  pointer-events: none;
  background-repeat: no-repeat;
}

#cupCut { transform-origin: 50% 95%; }

/* 커피 마시는 동안엔 바닥의 컵이 남자 손으로 (그림 속 컵만 보이게) */
.drinking #cupCut { visibility: hidden; }
#canCut { transform-origin: 70% 97%; }

/* 컵 : 올리면 달그락 (누르면 남자가 커피를 마심) */
#cupCut.wobble { animation: wobble 0.7s ease-in-out; }

@keyframes wobble {
  0%   { rotate: 0deg; }
  20%  { rotate: -6deg; }
  40%  { rotate: 5deg; }
  60%  { rotate: -3deg; }
  80%  { rotate: 1.5deg; }
  100% { rotate: 0deg; }
}

/* 캔 : 올리면 기우뚱 / 누르면 찌그럭 */
#canCut.tilt  { animation: tilt 0.8s cubic-bezier(.3, 1.4, .5, 1); }
#canCut.crush { animation: crush 0.5s ease-out; }

@keyframes tilt {
  0%   { rotate: 0deg; }
  35%  { rotate: 13deg; }
  60%  { rotate: -4deg; }
  80%  { rotate: 2deg; }
  100% { rotate: 0deg; }
}

@keyframes crush {
  0%   { scale: 1 1; }
  30%  { scale: 1.18 0.68; }
  60%  { scale: 0.94 1.06; }
  100% { scale: 1 1; }
}

/* 이불 : 올리면 들썩 */
.heave #blanketOpen,
.heave #blanketFolded,
.heave #blanketCover {
  animation: heave 1s ease-in-out;
  transform-origin: 80% 100%;
}

@keyframes heave {
  0%   { translate: 0 0;     scale: 1 1; }
  30%  { translate: 0 -0.7%; scale: 1.004 1.014; }
  60%  { translate: 0 0.2%;  scale: 1 0.997; }
  100% { translate: 0 0;     scale: 1 1; }
}


/* ───── 클릭 영역 (투명 버튼) ───── */
.hot {
  position: absolute;
  z-index: 5;
  cursor: pointer;
}

/* H 키: 클릭 영역 빨간 점선으로 보기 */
.debug .hot,
.debug .sprite {
  outline: 2px dashed red;
  background: rgba(255, 0, 0, 0.08);
}


/* =========================================================
   ★ 메인 인터랙션 : 무위(꾹 누르기) / 인위(억지로 끌기)
   ========================================================= */
.fx {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* 무위 : 장판(ground.png)이 바닥 전체에 서서히 올라옴 */
#ground {
  position: absolute;
  inset: 0;
  z-index: 3;
  background: #ffffff;
  opacity: 0;
  pointer-events: none;
  clip-path: inset(4.44% 7.22% 15.11% 16.6%);   /* 장판(바닥) 범위만 — 벽·창문은 그대로 */
}

#hotMan, #hotFace, #hotBody {
  cursor: grab;
  touch-action: none;
}

/* 장판 문지르기 : 바닥 전체 (인물·소품 클릭 영역보다 아래) */
#hotFloor {
  z-index: 3;
  cursor: grab;
  touch-action: none;
}

#rubCanvas {
  z-index: 3;
}


/* ───── 무위 · 인위 게이지 ─────
   선 = 주윤 그림 속 장판 테두리 연필 선을 그대로 떼어 온 것 (gauge-line.png)
   처음부터 늘 보이고, 아래에 어떻게 하면 되는지 안내 문구 */
#gauge {
  position: absolute;
  left: 49%;
  top: 84.6%;
  width: 30%;
  z-index: 20;
  pointer-events: none;
  font-family: 'SM3Gyeonchul', serif;
  -webkit-text-stroke: 0.035em currentColor;
}

.gBox { margin-bottom: 0.6cqh; }

#gMu { color: #BE8500; }
#gIn { color: #111111; }

.gRow {
  display: flex;
  align-items: center;
  gap: 1.2cqh;
}

.gLab {
  font-size: 2.1cqh;
  line-height: 1.25;
  white-space: nowrap;
}

.gLine {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 1.9cqh;
}

/* 연필 선 (script 가 gauge-line.png 를 색 입혀서 그림) */
.gLine canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.gPct {
  font-size: 1.8cqh;
  width: 3em;
  text-align: right;
}

.gCap {
  margin-top: 0.2cqh;
  font-size: 1.55cqh;
  line-height: 1.3;
  white-space: nowrap;
  opacity: 0.8;
  -webkit-text-stroke: 0.02em currentColor;
}

.grabbing, .grabbing * {
  cursor: grabbing !important;
}

/* 인위 : 손 떼면 튀어나오는 '쩍!' */
.jjeok {
  position: absolute;
  z-index: 40;
  pointer-events: none;
  font-family: 'SM3Gyeonchul', serif;
  font-size: 6cqh;
  color: #111;
  white-space: nowrap;
  -webkit-text-stroke: 0.04em currentColor;   /* 글씨 굵게 */
  animation: jjeok 0.9s ease-out forwards;
}

.jjeok.small {
  font-size: 3.4cqh;
  color: #444;
}

@keyframes jjeok {
  0%   { transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); opacity: 0; }
  18%  { transform: translate(-50%, -50%) scale(1.3)  rotate(5deg);  opacity: 1; }
  35%  { transform: translate(-50%, -50%) scale(1)    rotate(-3deg); opacity: 1; }
  100% { transform: translate(-50%, -110%) scale(1)   rotate(0deg);  opacity: 0; }
}


/* =========================================================
   결과 화면 : itsright.png (무위) / itswrong.png (인위)
   → 몇 초 머물다가 저절로 사라지고 방으로 돌아옴
   ========================================================= */
#result {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  opacity: 0;
  overflow: hidden;
}

#result.show { display: block; }

#result img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;            /* 화면 꽉 채우기 */
}

#result.right { background: #BE8500; }
#result.wrong { background: #000; }

/* 무위 · 인위 둘 다 : 예고 없이 한 번에 쿵! 박힘 */
#result.right.in,
#result.wrong.in {
  opacity: 1;
  transition: none;
}
#result.right.in img,
#result.wrong.in img {
  animation: bang 0.22s cubic-bezier(.3, 1.6, .5, 1) both;
}
@keyframes bang {
  from { transform: scale(1.08); }
  to   { transform: scale(1); }
}

/* 사라질 때 : 둘 다 스르르 */
/* 인위 : 다음 장(itswrong2.png)으로 바뀔 때 그림만 잠깐 스르르 */
#result img {
  transition: opacity 0.4s ease;
}
#result img.swap {
  opacity: 0;
}

/* 다음 장이 떠 있는 동안 : 누르면 닫힘 */
#result.wait {
  cursor: pointer;
}

#result.out {
  opacity: 0;
  transition: opacity 1.4s ease;
}

/* ───── 무위 뒤 설명글 (end.png) ─────
   방 그림 위에 반투명 흰 막(#endVeil) → 그 위에 설명 텍스트(#endText)
   (end.png 의 흰 배경은 '곱하기'로 사라지고 글씨만 남음)
   화면을 누르면 다시 원래 방으로 */
#endVeil {
  position: absolute;
  inset: 0;
  z-index: 45;
  background: rgba(255, 255, 255, 0.75);   /* 반투명 정도 : 0(투명) ~ 1(완전 흰색) */
  opacity: 0;
  pointer-events: none;
  cursor: pointer;
  transition: opacity 0.8s ease;
}

#endText {
  z-index: 46;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.8s ease;
}

.ending #endVeil {
  opacity: 1;
  pointer-events: auto;                     /* 설명글이 떠 있는 동안엔 누르면 닫힘 */
}

.ending #endText {
  opacity: 1;
}

/* 다음 설명 페이지로 넘어갈 때 : 글씨만 잠깐 스르르 사라졌다가 새 페이지로 */
.ending #endText.swap {
  opacity: 0;
  transition: opacity 0.4s ease;
}

/* 설명글이 떠 있는 동안엔 양옆 가사가 글씨를 가리지 않게 옅어짐 */
.lyrics { transition: opacity 0.8s ease; }
body.reading .lyrics {
  opacity: 0.12;
  pointer-events: none;
}
body.reading .lyrics .line { pointer-events: none; }


/* =========================================================
   3. 가사 — 브라우저 화면 기준 맨 왼쪽 / 맨 오른쪽 끝에 딱 붙음
   ========================================================= */
.lyrics {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);   /* 위아래 가운데 */
  white-space: nowrap;
  font-family: 'SM3Gyeonchul', serif;
  font-weight: normal;
  font-size: 13px;               /* 실제 크기는 script 가 화면에 다 들어가게 자동 계산 */
  line-height: 1.85;
  color: #BE8500;
  -webkit-text-stroke: 0.035em currentColor;   /* 서체가 얇아 보여서 외곽선으로 살짝 두껍게 (숫자 키우면 더 두꺼워짐) */
  z-index: 50;
  pointer-events: none;
}

.lyrics.left  { left: 0;  padding-left: 14px;  text-align: left;  }
.lyrics.right { right: 0; padding-right: 14px; text-align: right; }

/* 가사 한 줄 : 누르면 노래가 그 부분으로 이동
   무위가 진행될수록 (--mu) 옅어지며 바닥으로 가라앉음 */
.line {
  width: fit-content;
  pointer-events: auto;
  cursor: pointer;
  transform: translateY(calc(var(--mu, 0) * var(--f, 1) * 2.4em));
  opacity: calc(1 - var(--mu, 0) * 0.85);
}

.lyrics.right .line { margin-left: auto; }

/* 마우스 올린 줄 / 누른 줄 : 글씨가 더 굵게 */
.line:hover,
.line.picked {
  -webkit-text-stroke-width: 0.11em;
}

.line.gap {
  height: 1.85em;
  pointer-events: none;
}

/* 인위 : 억지로 끄는 동안 가사가 덜덜 */
.lyrics.shiver {
  animation: shiver 0.09s linear infinite;
}

@keyframes shiver {
  0%   { translate: 0 0; }
  25%  { translate: calc(var(--sh, 0) * 1px) calc(var(--sh, 0) * -0.6px); }
  50%  { translate: calc(var(--sh, 0) * -0.8px) calc(var(--sh, 0) * 0.5px); }
  75%  { translate: calc(var(--sh, 0) * 0.5px) calc(var(--sh, 0) * 0.8px); }
  100% { translate: 0 0; }
}

/* 가사 속 단어 반응 (노래가 그 줄을 부를 때 / 마우스 올릴 때) */
.kw { display: inline-block; }

/* 끈적 단어 : 쭈욱 늘어났다가 쩍 붙음 */
.kw-sticky.fire {
  animation: stretch 1.1s cubic-bezier(.3, 1.4, .5, 1);
  transform-origin: 0 60%;
}
.lyrics.right .kw-sticky.fire { transform-origin: 100% 60%; }

@keyframes stretch {
  0%   { transform: none; }
  30%  { transform: scaleX(1.7) skewX(-10deg); }
  50%  { transform: scaleX(0.8) skewX(4deg); }
  70%  { transform: scaleX(1.12); }
  100% { transform: none; }
}

/* 장판 단어 : 눅눅하게 축 늘어짐 */
.kw-droop.fire {
  animation: droop 2.6s ease-in-out;
  transform-origin: 50% 0;
}

@keyframes droop {
  0%   { transform: none; }
  35%  { transform: translateY(0.18em) scaleY(1.45) skewX(6deg); }
  60%  { transform: translateY(0.22em) scaleY(1.5) skewX(-3deg); }
  100% { transform: none; }
}

/* 담배 단어 : 연기처럼 흐릿하게 피어오름 */
.kw-smoke.fire {
  animation: smokeword 2.4s ease-out;
}

@keyframes smokeword {
  0%   { transform: none; filter: none; opacity: 1; }
  40%  { transform: translateY(-0.4em); filter: blur(1.5px); opacity: 0.45; }
  100% { transform: none; filter: none; opacity: 1; }
}

/* K 키 : 가사 타이밍 녹음 안내 상자 */
#recBox {
  position: fixed;
  left: 50%;
  top: 14px;
  transform: translateX(-50%);
  z-index: 300;
  display: none;
  padding: 10px 16px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.8);
  color: #ffffff;
  font-size: 13px;
  line-height: 1.6;
  text-align: center;
  white-space: nowrap;
}

/* ===================== 작은 도구들 ===================== */
function rand(a, b) { return a + Math.random() * (b - a); }

function pct(v, total) { return (v / total * 100) + '%'; }

function placeBox(el, box) {
  el.style.left   = pct(box[0], W);
  el.style.top    = pct(box[1], H);
  el.style.width  = pct(box[2], W);
  el.style.height = pct(box[3], H);
}

function placeShape(el, points) {
  el.style.inset = '0';
  el.style.clipPath = 'polygon(' + points.map(function (p) {
    return pct(p[0], W) + ' ' + pct(p[1], H);
  }).join(', ') + ')';
}

// rate : 재생 속도 (1 = 원래, 작으면 낮고 느리게 → '쩌어억', 크면 짧고 높게 → '쩍')
function play(name, volume, rate) {
  if (!SOUNDS[name]) return null;
  const a = new Audio(SOUND_DIR + SOUNDS[name]);
  a.volume = Math.max(0, Math.min(1, (volume == null ? 1 : volume) * SFX_VOL));
  if (rate) { a.preservesPitch = false; a.playbackRate = rate; }
  a.play().catch(function () {});
  return a;
}

// 원본 그림에서 필요한 부분만 잘라 움직이는 조각으로 만들기
// (box 는 원본 파일 안의 위치, 화면에서는 SPRITE_SCALE 배 크기로 보임)
function makeSprite(id, src, box) {
  const w = box[2] * SPRITE_SCALE;
  const h = box[3] * SPRITE_SCALE;

  const outer = document.createElement('div');
  outer.className = 'sprite ink';
  if (id) outer.id = id;
  outer.style.width  = pct(w, W);
  outer.style.height = pct(h, H);

  const pic = document.createElement('div');
  pic.className = 'pic';
  pic.style.backgroundImage    = 'url(' + src + ')';
  pic.style.backgroundSize     = (SPRITE_W / box[2] * 100) + '% ' + (SPRITE_H / box[3] * 100) + '%';
  pic.style.backgroundPosition = (box[0] / (SPRITE_W - box[2]) * 100) + '% ' + (box[1] / (SPRITE_H - box[3]) * 100) + '%';

  outer.appendChild(pic);
  room.appendChild(outer);

  return { el: outer, pic: pic, w: w, h: h, x: 0, y: 0 };
}

// 조각을 캔버스 좌표 (cx, cy) 중심에 놓기
function moveSprite(s, cx, cy) {
  s.x = cx;
  s.y = cy;
  const k = stage.clientWidth / W;
  s.el.style.transform = 'translate(' + ((cx - s.w / 2) * k) + 'px, ' + ((cy - s.h / 2) * k) + 'px)';
}

function angleDiff(a, b) {
  return ((b - a + 540) % 360) - 180;
}

  cut.className = 'cut ink';
  cut.id = id;

  room.appendChild(patch);
  room.appendChild(cut);
  cut.addEventListener('animationend', function () { cut.className = 'cut ink'; });
  return cut;
}

   ========================================================= */
const POSES = {
  base:     document.getElementById('poseBase'),
  straight: document.getElementById('poseStraight'),
  leg1:     document.getElementById('poseLeg1'),
  leg2:     document.getElementById('poseLeg2'),
  inhand:   document.getElementById('poseInhand'),
  drink:    document.getElementById('poseDrink')
};

const POSE_ORDER = ['base', 'straight', 'belly', 'scratch', 'straight'];
let poseStep = 0;

const SC = { on: false, frame: 0, timer: 0, left: 0 };   // 배 긁기 상태

function showPose(name) {
  Object.keys(POSES).forEach(function (k) {
    POSES[k].classList.toggle('on', k === name);
  });
}

function setPose(state) {
  SC.on = false;
  if (state === 'base')     showPose('base');
  if (state === 'straight') showPose('straight');
  if (state === 'belly')    showPose('leg1');
  if (state === 'scratch') {
    SC.on = true;
    SC.frame = 0;
    SC.timer = 0;
    SC.left = Math.round(rand(SCRATCH_BURST[0], SCRATCH_BURST[1])) * 2;
    showPose('leg2');
  }
}

// 긁적긁적: 몇 번 빠르게 긁고 → 잠깐 쉬고 → 다시 긁고
function updateScratch(dt) {
  if (!SC.on) return;
  SC.timer -= dt;
  if (SC.timer > 0) return;

  if (SC.left > 0) {
    SC.frame = 1 - SC.frame;
    showPose(SC.frame ? 'leg2' : 'leg1');
    if (SC.frame) play('scratch', rand(0.55, 0.85), rand(0.85, 1.2));   // 매번 조금씩 다르게 사각
    SC.left--;
    SC.timer = SCRATCH_SPEED * rand(0.8, 1.25);
  } else {
    showPose('leg1');                                        // 손 얹고 잠깐 멈춤
    SC.timer = rand(SCRATCH_REST[0], SCRATCH_REST[1]);
    SC.left = Math.round(rand(SCRATCH_BURST[0], SCRATCH_BURST[1])) * 2;
  }
}

/* =========================================================
   바퀴벌레: 멈췄다가 → 스스슥 → 또 멈추고 (몸 위로도 지나감)
   ========================================================= */
const roach = makeSprite('roach', 'roach.png', ROACH_BOX);

const R = {
  x: ROACH_BOX[0] + ROACH_BOX[2] / 2,
  y: ROACH_BOX[1] + ROACH_BOX[3] / 2,
  angle: ROACH_DRAWN_ANGLE,
  tx: 0, ty: 0,
  speed: 0,
  running: false,
  wait: rand(1.5, 3)
};

function roachNewTarget(fast) {
  let tx, ty;
  do {
    tx = rand(FLOOR[0], FLOOR[2]);
    ty = rand(FLOOR[1], FLOOR[3]);
  } while (Math.hypot(tx - R.x, ty - R.y) < (fast ? 900 : 350));
  R.tx = tx;
  R.ty = ty;
  R.speed = fast ? rand(1500, 1900) : rand(650, 1100);
  R.running = true;
  // 바퀴벌레 소리 : 너무 자주 나지 않게 쉬었다가
  const now = performance.now() / 1000;
  if (started && now - AMB.roachAt > (fast ? 1.5 : ROACH_GAP)) {
    AMB.roachAt = now;
    play('roach', AMB_VOL.roach * calmNow);
  }
}

function updateRoach(dt, t) {
  let wiggle = 0;

  if (R.running) {
    const dx = R.tx - R.x;
    const dy = R.ty - R.y;
    const dist = Math.hypot(dx, dy);

    const want = Math.atan2(dy, dx) * 180 / Math.PI;
    R.angle += angleDiff(R.angle, want) * Math.min(1, dt * 12);

    const step = Math.min(dist, R.speed * dt);
    const rad = R.angle * Math.PI / 180;
    R.x += Math.cos(rad) * step;
    R.y += Math.sin(rad) * step;

    wiggle = Math.sin(t * 45) * 5;

    if (dist < 25 || Math.random() < dt * 0.35) {
      R.running = false;
      R.wait = rand(0.4, 3.2);
    }
  } else {
    wiggle = Math.sin(t * 7) * 2 + (Math.random() < 0.02 ? rand(-8, 8) : 0);
    R.wait -= dt;
    if (R.wait <= 0) roachNewTarget(false);
  }

  moveSprite(roach, R.x, R.y);
  roach.pic.style.transform = 'rotate(' + (R.angle - ROACH_DRAWN_ANGLE + wiggle) + 'deg)';
}

// 클릭 → 화들짝 도망
roach.el.addEventListener('pointerdown', function () {
  roachNewTarget(true);
});


/* =========================================================

const BODY_DY = (MOSQUITO_BODY[1] - (MOSQUITO_BOX[1] + MOSQUITO_BOX[3] / 2)) * SPRITE_SCALE;
// 피 조각 중심 → 피 터진 중심까지 거리
const CORE_DX = (BLOOD_CORE[0] - (BLOOD_BOX[0] + BLOOD_BOX[2] / 2)) * SPRITE_SCALE;
const CORE_DY = (BLOOD_CORE[1] - (BLOOD_BOX[1] + BLOOD_BOX[3] / 2)) * SPRITE_SCALE;
// 피가 터지는 기준점 (회전·튀어나오는 효과도 이 점 기준)
const CORE_ORIGIN = ((BLOOD_CORE[0] - BLOOD_BOX[0]) / BLOOD_BOX[2] * 100) + '% ' +
                    ((BLOOD_CORE[1] - BLOOD_BOX[1]) / BLOOD_BOX[3] * 100) + '%';

const M = {
  x: MOSQUITO_BOX[0] + MOSQUITO_BOX[2] / 2,
  y: MOSQUITO_BOX[1] + MOSQUITO_BOX[3] / 2,
  vx: 0, vy: 0,
  tx: 0, ty: 0,
  retarget: 0,
  alive: true,
  dir: 1
};

const stains = [];   // 화면에 남아있는 피 자국들

function mosquitoNewTarget() {
  M.tx = rand(80, W - 80);
  M.ty = rand(80, H - 80);
  M.retarget = rand(0.7, 2.2);
}

function updateMosquito(dt, t) {
  if (!M.alive) return;

  M.retarget -= dt;
  if (M.retarget <= 0) mosquitoNewTarget();

  const ax = (M.tx - M.x) * 2.2 + rand(-1400, 1400);
  const ay = (M.ty - M.y) * 2.2 + rand(-1400, 1400);
  M.vx = (M.vx + ax * dt) * Math.pow(0.25, dt);
  M.vy = (M.vy + ay * dt) * Math.pow(0.25, dt);

  const sp = Math.hypot(M.vx, M.vy);
  const MAX = 650;
  if (sp > MAX) { M.vx *= MAX / sp; M.vy *= MAX / sp; }

  M.x += M.vx * dt;
  M.y += M.vy * dt;

  // 날갯짓 떨림
  const bx = Math.sin(t * 61) * 3;
  const by = Math.cos(t * 47) * 5;

  if (M.vx < -40) M.dir = -1;
  if (M.vx >  40) M.dir =  1;

  moveSprite(mosquito, M.x + bx, M.y + by);
  mosquito.pic.style.transform = 'scaleX(' + M.dir + ') rotate(' + (M.vy * 0.02) + 'deg)';
}

// 잡힌 자리에 납작한 모기 + 피 남기기
function leaveStain(x, y, dir) {
  const body = makeSprite(null, 'mosquito.png', MOSQUITO_BOX);
  body.el.classList.add('corpse');
  body.el.style.scale = dir + ' 1';
  moveSprite(body, x, y);

  // 모기 몸통 위치 = 피가 터지는 중심
  const bodyX = x + BODY_DX * dir;
  const bodyY = y + BODY_DY;

  const b = makeSprite(null, 'blood.png', BLOOD_BOX);
  b.el.classList.add('blood');
  b.el.style.transformOrigin  = CORE_ORIGIN;
  b.pic.style.transformOrigin = CORE_ORIGIN;
  b.el.style.rotate = rand(-25, 25) + 'deg';   // 매번 조금씩 다른 모양으로
  moveSprite(b, bodyX - CORE_DX, bodyY - CORE_DY);

  const pair = [body, b];
  stains.push(pair);

  setTimeout(function () {
    body.el.classList.add('fade');
    b.el.classList.add('fade');
  }, STAIN_TIME * 1000);

  setTimeout(function () {
    body.el.remove();
    b.el.remove();
    stains.splice(stains.indexOf(pair), 1);
  }, STAIN_TIME * 1000 + 600);
}

// 모기 클릭 → 잡힘
mosquito.el.addEventListener('pointerdown', function () {
  if (!M.alive) return;
  M.alive = false;

  play('slap');                              // 짝!
  MQ.left = Math.min(MQ.left, 0.12);         // 윙윙 소리 뚝

  leaveStain(mosquito.x, mosquito.y, M.dir);   // 잡은 그 자리에서 터짐
  mosquito.el.classList.add('hide');

  stage.classList.remove('shake');
  void stage.offsetWidth;
  stage.classList.add('shake');

  setTimeout(respawnMosquito, rand(MOSQUITO_RESPAWN[0], MOSQUITO_RESPAWN[1]) * 1000);
});

function respawnMosquito() {
  const side = Math.floor(rand(0, 4));
  M.x = side === 0 ? -100 : side === 1 ? W + 100 : rand(0, W);
  M.y = side === 2 ? -100 : side === 3 ? H + 100 : rand(0, H);
  M.vx = 0;
  M.vy = 0;
  mosquitoNewTarget();
  M.alive = true;
  mosquito.el.classList.remove('hide');
  MQ.wait = 0.4;                             // 새 모기가 오면 곧 윙~
}

mosquitoNewTarget();


/* =========================================================
   ★★ 메인 인터랙션 ★★
   - 톡 누르기        : 얼굴 → 표정 / 팔·배 → 자세 (기존 그대로)
   - 화면 아래 게이지 : 無爲 / 人爲 가 얼마나 진행됐는지 (그림 속 연필 선) + 안내 문구
   - 꾹 누르고 가만히 : 무위(無爲) → 정자세로 눕고,
                        장판(ground.png)이 서서히 올라오며 인물이 옅어짐
                        → 결국 인물은 사라지고 장판만 남음 (물아일체)
                        → 다 올라오면 itsright.png 가 쿵!
                        → 그 뒤 방 위에 설명글(end.png) → 화면 누르면 원래 방으로
                        (중간에 손 떼면 천천히 다시 사람으로 돌아옴)
   - 잡고 끌기        : 인위(人爲) → 몸이 장판에 쩌억 달라붙어
                        고무처럼 늘어나고, 손 떼면 '쩍!' 하고 다시 붙음
                        → 계속 억지로 끌다 보면 갑자기 쾅! itswrong.png
   ========================================================= */
const RES = 0.5;                       // 인위 효과 그림 해상도 (낮추면 가벼워짐)
const CW = W * RES;
const CH = H * RES;

const groundEl   = document.getElementById('ground');
const inwiCanvas = document.getElementById('inwiCanvas');
const faceImgEl  = document.getElementById('faceImg');

inwiCanvas.width = CW;
inwiCanvas.height = CH;
const ic = inwiCanvas.getContext('2d');

function newCanvas() {
  const c = document.createElement('canvas');
  c.width = CW;
  c.height = CH;
  return c;
}

const manCut = newCanvas();            // 인위 : 끌기 시작할 때 찍어둔 인물 모습
const mc = manCut.getContext('2d');

function manPath(ctx) {
  ctx.beginPath();
  MAN_SHAPE.forEach(function (p, i) {
    if (i) ctx.lineTo(p[0] * RES, p[1] * RES);
    else   ctx.moveTo(p[0] * RES, p[1] * RES);
  });
  ctx.closePath();
}

function smooth(a, b, v) {
  const t = Math.max(0, Math.min(1, (v - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

const hotMan = document.getElementById('hotMan');
placeShape(hotMan, MAN_SHAPE);


/* =========================================================
   무위
   ========================================================= */
const MU = { p: 0, holding: false, done: false, back: false };

function startMuwi() {
  G.mode = 'muwi';
  MU.holding = true;
  MU.back = false;
  // 꾹 누르면 먼저 정자세로 반듯하게 눕기
  clearTimeout(faceTimer);
  stage.classList.remove('angry');
  if (POSE_ORDER[poseStep] !== 'straight') {
    poseStep = 1;
    setPose('straight');
  }
  IN.effort *= 0.5;                    // 가만히 있으면 억지로 한 흔적도 옅어짐
}

function stopMuwi() {
  MU.holding = false;
}

function updateMuwi(dt) {
  if (MU.done) {
    // 다 올라온 뒤엔 그대로 (결과 화면이 끝날 때까지)
  } else if (MU.holding) {
    MU.p = Math.min(1, MU.p + dt / MUWI_TIME);
    if (MU.p >= 1) {
      MU.done = true;
      setTimeout(function () { showResult('right'); }, MUWI_PAUSE * 1000);
    }
  } else if (MU.p > 0) {
    MU.p = Math.max(0, MU.p - dt * (MU.back ? 0.35 : MUWI_BACK));
    if (MU.p <= 0) MU.back = false;
  }
  drawMuwi();
}

// 무위 소리 : 누르고 있는 동안 스르르 커지고, 떼면 스르르 작아짐
//            소리 위치는 장판이 올라온 정도에 맞춰 이어짐 (다시 누르면 하던 곳부터)
const MS = { audio: null, vol: 0 };

function updateMuwiSound(dt) {
  if (!SOUNDS.muwi) return;
  if (!MS.audio) {
    MS.audio = new Audio(SOUNDS.muwi);
    MS.audio.preservesPitch = false;     // 느리게 → 소리도 낮고 몽롱하게
  }
  const a = MS.audio;
  const want = (MU.holding || MU.done) && !resultOpen ? 1 : 0;
  MS.vol += Math.max(-dt / MUWI_FADE, Math.min(dt / MUWI_FADE, want - MS.vol));

  if (MS.vol > 0.001) {
    if (a.paused) {
      a.playbackRate = MUWI_RATE;
      const dur = a.duration || 14;
      a.currentTime = Math.min(dur - 0.5, MU.p * MUWI_TIME * MUWI_RATE);
      a.play().catch(function () {});
    }
    a.volume = Math.max(0, Math.min(1, MS.vol * MUWI_VOL * SFX_VOL));
  } else if (!a.paused) {
    a.pause();
  }
}

// 장판이 올라온 정도 = ground.png 의 불투명도 (0 → 1)
function drawMuwi() {
  groundEl.style.opacity = smooth(0, 1, MU.p);   // 천천히 시작 → 천천히 끝
}


/* =========================================================
   인위
   ========================================================= */
const IN = {
  active: false, spring: false,
  gx: 0, gy: 0,          // 잡은 곳
  tx: 0, ty: 0,          // 끌고 싶은 만큼
  px: 0, py: 0,          // 실제로 늘어난 만큼
  vx: 0, vy: 0,
  effort: 0, idle: 0,
  auto: 0,               // 노래가 대신 쓰는 '쩍' (남은 시간)
  strands: []
};

// 잡은 곳 주변만 떼어낸 조각 (가장자리는 흐릿하게 → 반죽처럼 늘어남)
const GRAB_R = 170;                    // 늘어나는 덩어리 크기 (반지름)
const grabPart = newCanvas();
const gc = grabPart.getContext('2d');

function currentPoseImg() {
  for (const k in POSES) if (POSES[k].classList.contains('on')) return POSES[k];
  return POSES.base;
}

// 지금 인물 모습을 찍어두기 (화난 얼굴 포함)
function snapshotMan() {
  mc.clearRect(0, 0, CW, CH);
  mc.save();
  manPath(mc);
  mc.clip();
  mc.drawImage(currentPoseImg(), 0, 0, CW, CH);
  if (stage.classList.contains('angry')) {
    mc.fillStyle = '#fff';
    mc.beginPath();
    mc.ellipse(890 * RES, 975 * RES, 98 * RES, 112 * RES, 0, 0, Math.PI * 2);
    mc.fill();
    mc.globalCompositeOperation = 'multiply';
    mc.drawImage(faceImgEl, 600, 720, 460, 440, 600 * RES, 720 * RES, 460 * RES, 440 * RES);
  }
  mc.restore();
}

function startInwi() {
  G.mode = 'inwi';
  document.body.classList.add('grabbing');

  MU.holding = false;
  MU.p *= 0.3;                          // 억지로 하면 무위가 깨짐

  makeAngry(999);                       // 끌려가는 동안 짜증난 얼굴
  play('stick', 0.7, 0.75);             // 장판에서 쩌어억 — 떨어지기 시작
  IN.peel = 0;
  snapshotMan();
  prepareGrab(G.cx, G.cy);
  IN.active = true;
}

// 잡은 곳(x, y) 주변 덩어리 + 끈적한 실 준비
function prepareGrab(x, y) {
  IN.spring = false;
  IN.gx = x;
  IN.gy = y;
  IN.px = IN.py = IN.vx = IN.vy = 0;

  // 잡은 곳 주변 덩어리 만들기
  const gx = IN.gx * RES, gy = IN.gy * RES, R = GRAB_R * RES * 2;
  gc.clearRect(0, 0, CW, CH);
  gc.drawImage(manCut, 0, 0);
  gc.globalCompositeOperation = 'destination-in';
  const gr = gc.createRadialGradient(gx, gy, 0, gx, gy, R);
  gr.addColorStop(0, 'rgba(0,0,0,1)');
  gr.addColorStop(0.55, 'rgba(0,0,0,0.9)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  gc.fillStyle = gr;
  gc.fillRect(0, 0, CW, CH);
  gc.globalCompositeOperation = 'source-over';

  // 끈적한 실
  IN.strands = [];
  for (let i = 0; i < 14; i++) {
    const a = rand(0, Math.PI * 2);
    const d = rand(0, 170);
    IN.strands.push({
      ox: Math.cos(a) * d, oy: Math.sin(a) * d,
      w: rand(0.8, 2.6),
      snap: rand(0.45, 1.25) * PULL_MAX,
      sag: rand(-1, 1)
    });
  }
}

// 노래가 장판에 달라붙는 대목 : 아무도 안 건드려도 인물이 혼자 '쩍' 들썩
function autoJolt() {
  if (!started || G.on || MU.holding || MU.p > 0.05 || MU.done || drinking ||
      resultOpen || endOpen || IN.active || IN.spring) return;
  makeAngry(1.6);
  snapshotMan();
  prepareGrab(rand(1250, 1650), rand(880, 1050));
  IN.active = true;
  IN.auto = 0.5;                          // 0.5초 동안 들렸다가
  IN.tx = rand(-30, 30);
  IN.ty = -rand(150, 200);
}

function moveInwi(cx, cy, moved) {
  const rx = cx - IN.gx;
  const ry = cy - IN.gy;
  const m = Math.hypot(rx, ry) || 1;
  // 끌수록 점점 버팀 (끝까지는 절대 안 떨어짐)
  const tired = 1 - 0.4 * Math.min(1, IN.effort / INWI_LIMIT);
  const len = PULL_MAX * tired * (1 - Math.exp(-m / 260));
  IN.tx = rx / m * len;
  IN.ty = ry / m * len;
  IN.effort += moved;
  IN.idle = 0;

  // 계속 끄는 동안 군데군데 쩌억… 쩍… (끌수록 낮고 무겁게)
  IN.peel = (IN.peel || 0) + moved;
  if (IN.peel > PEEL_EVERY) {
    IN.peel = 0;
    const tiredness = Math.min(1, IN.effort / INWI_LIMIT);
    play('stick', 0.55 + 0.35 * tiredness, rand(0.8, 1.05) - 0.2 * tiredness);
  }

  // 계속 억지로 끌다 보면… 예고 없이 쾅!
  if (IN.effort >= INWI_LIMIT) {
    document.body.classList.remove('grabbing');
    IN.active = false;
    IN.spring = false;
    IN.px = IN.py = IN.vx = IN.vy = 0;
    G.on = false;
    G.mode = '';
    showResult('wrong');
  }
}

function releaseInwi() {
  document.body.classList.remove('grabbing');
  IN.active = false;
  IN.spring = true;                      // 고무줄처럼 '쩍' 되돌아감
  makeAngry(FACE_TIME);

  const m = Math.hypot(IN.px, IN.py);
  if (m > 25) {
    // 많이 늘였을수록 크고 묵직한 '쩌억!', 조금이면 짧은 '쩍!'
    const big = m > PULL_MAX * 0.6;
    play('stick', big ? 1 : 0.8, big ? 0.85 : 1.15);
    popText(m > PULL_MAX * 0.6 ? '쩌억!' : '쩍!', IN.gx, IN.gy);
    stage.classList.remove('shake');
    void stage.offsetWidth;
    stage.classList.add('shake');
  }
}

function popText(txt, x, y, small) {
  const el = document.createElement('div');
  el.className = small ? 'jjeok small' : 'jjeok';
  el.textContent = txt;
  el.style.left = pct(x, W);
  el.style.top  = pct(y, H);
  stage.appendChild(el);
  setTimeout(function () { el.remove(); }, 950);
}

function updateInwi(dt) {
  if (IN.auto > 0) {                     // 노래가 대신 쓰는 '쩍' : 들렸다가 → 쩍!
    IN.auto -= dt;
    if (IN.auto <= 0) {
      IN.auto = 0;
      releaseInwi();
    }
  }

  if (IN.active) {
    // 손을 따라가되 끈적하게 늦게
    IN.px += (IN.tx - IN.px) * Math.min(1, dt * 10);
    IN.py += (IN.ty - IN.py) * Math.min(1, dt * 10);
  } else if (IN.spring) {
    // 스프링 : 튕기듯 제자리로
    IN.vx += (-320 * IN.px - 11 * IN.vx) * dt;
    IN.vy += (-320 * IN.py - 11 * IN.vy) * dt;
    IN.px += IN.vx * dt;
    IN.py += IN.vy * dt;
    if (Math.hypot(IN.px, IN.py) < 0.6 && Math.hypot(IN.vx, IN.vy) < 8) {
      IN.spring = false;
      IN.px = IN.py = 0;
    }
  }

  // 가만히 두면 억지로 한 흔적이 아주 천천히 사라짐
  if (!IN.active) {
    IN.idle += dt;
    if (IN.idle > 2) IN.effort = Math.max(0, IN.effort - dt * 300);
  }

  drawInwi();
}

function drawInwi() {
  ic.clearRect(0, 0, CW, CH);
  if (!IN.active && !IN.spring) return;

  const gx = IN.gx * RES;
  const gy = IN.gy * RES;
  const px = IN.px * RES;
  const py = IN.py * RES;
  const pull = Math.hypot(IN.px, IN.py) / PULL_MAX;

  // ① 원래 몸 자리를 하얗게 (아래 그림이 겹쳐 보이지 않게)
  ic.save();
  manPath(ic);
  ic.clip();
  ic.fillStyle = '#fff';
  ic.fillRect(0, 0, CW, CH);
  // 장판에 눌어붙은 몸 자국
  ic.globalAlpha = 0.28 * pull;
  ic.drawImage(manCut, 0, 0);
  ic.globalAlpha = 1;
  ic.restore();

  // ② 몸 전체는 장판에 붙은 채 아주 살짝만 들림
  ic.drawImage(manCut, px * 0.04, py * 0.04);

  // ③ 잡은 곳이 반죽처럼 쭈욱 늘어남 (가운데가 가늘어지는 목)
  const R = GRAB_R * RES * 2;
  const N = 18;
  for (let i = 1; i <= N; i++) {
    const tt = i / N;
    const neck = 1 - 0.45 * Math.sin(Math.PI * tt) * pull;
    const ox = px * tt;
    const oy = py * tt;
    ic.globalAlpha = i === N ? 1 : 0.5;
    ic.save();
    ic.translate(gx + ox, gy + oy);
    ic.scale(neck, neck);
    ic.drawImage(grabPart, gx - R, gy - R, R * 2, R * 2, -R, -R, R * 2, R * 2);
    ic.restore();
  }
  ic.globalAlpha = 1;

  // ④ 장판과 몸 사이 끈적한 실
  if (IN.active) {
    IN.strands.forEach(function (st) {
      const ax = gx + st.ox * RES;
      const ay = gy + st.oy * RES;
      const bx = ax * (1 - 0.3 * pull) + gx * 0.3 * pull + px;   // 늘어난 덩어리 쪽 끝
      const by = ay * (1 - 0.3 * pull) + gy * 0.3 * pull + py;
      const len = Math.hypot(bx - ax, by - ay);
      if (len < 4) return;
      const broke = len / RES > st.snap;   // 너무 늘어나면 툭 끊어짐
      const mx = (ax + bx) / 2 - (by - ay) * 0.15 * st.sag;
      const my = (ay + by) / 2 + (bx - ax) * 0.15 * st.sag + len * 0.12;
      ic.lineCap = 'round';
      for (let j = 0; j < 2; j++) {        // 연필 느낌으로 두 번 겹쳐 그리기
        ic.strokeStyle = 'rgba(35,35,35,' + (j ? 0.25 : 0.6) + ')';
        ic.lineWidth = Math.max(0.5, st.w * (1 - len / (st.snap * RES * 1.4))) + j;
        ic.beginPath();
        if (broke) {                        // 끊어진 실은 양쪽에 축 늘어짐
          ic.moveTo(ax, ay);
          ic.quadraticCurveTo(ax + (mx - ax) * 0.3, ay + 12, ax + (bx - ax) * 0.18, ay + (by - ay) * 0.18 + 10);
          ic.moveTo(bx, by);
          ic.quadraticCurveTo(bx + (mx - bx) * 0.3, by + 12, bx + (ax - bx) * 0.18, by + (ay - by) * 0.18 + 10);
        } else {
          ic.moveTo(ax + j, ay);
          ic.quadraticCurveTo(mx, my, bx + j, by);
        }
        ic.stroke();
      }
    });
  }
}


/* =========================================================
   누르기 / 꾹 누르기 / 끌기 구분
   ========================================================= */
const G = { on: false, kind: '', mode: '', sx: 0, sy: 0, cx: 0, cy: 0, lx: 0, ly: 0, t0: 0 };

function toCanvas(e) {
  const r = stage.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}

function gestureStart(e, kind) {
  if (resultOpen || !started || MU.done || drinking) return;
  e.preventDefault();
  const c = toCanvas(e);
  G.on = true;
  G.kind = kind;
  G.mode = '';
  G.sx = e.clientX;
  G.sy = e.clientY;
  G.cx = c[0];
  G.cy = c[1];
  G.lx = c[0];
  G.ly = c[1];
  G.t0 = performance.now();
}

hotMan.addEventListener('pointerdown',  function (e) { gestureStart(e, 'man'); });
hotFace.addEventListener('pointerdown', function (e) { gestureStart(e, 'face'); });
hotBody.addEventListener('pointerdown', function (e) { gestureStart(e, 'body'); });

window.addEventListener('pointermove', function (e) {
  if (!G.on) return;
  const dist = Math.hypot(e.clientX - G.sx, e.clientY - G.sy);
  const c = toCanvas(e);

  if (G.mode === '' && dist > DRAG_START) startInwi();
  if (G.mode === 'inwi') moveInwi(c[0], c[1], Math.hypot(c[0] - G.lx, c[1] - G.ly));

  G.lx = c[0];
  G.ly = c[1];
});

window.addEventListener('pointerup', function () {
  if (!G.on) return;
  G.on = false;
  if (G.mode === '') {                   // 짧게 톡
    if (G.kind === 'face') tapFace();
    if (G.kind === 'body') tapBody();
  }
  if (G.mode === 'muwi') stopMuwi();
  if (G.mode === 'inwi') releaseInwi();
  G.mode = '';
});

function updateGesture() {
  if (G.on && G.mode === '' && (performance.now() - G.t0) / 1000 > HOLD_START) startMuwi();
}


/* =========================================================
   장판 문지르기
   - 바닥(인물 말고)을 누른 채 드래그 → 끈적한 자국이 남고 쩍쩍
   - 손 떼면 자국은 금방 말라서 사라짐
   ========================================================= */
const hotFloor  = document.getElementById('hotFloor');
const rubCanvas = document.getElementById('rubCanvas');
rubCanvas.width = CW;
rubCanvas.height = CH;
const rc = rubCanvas.getContext('2d');
placeBox(hotFloor, FLOOR_BOX);

const RB = { on: false, x: 0, y: 0, acc: 0, alive: 0 };

hotFloor.addEventListener('pointerdown', function (e) {
  if (!started || resultOpen || endOpen) return;
  e.preventDefault();
  const c = toCanvas(e);
  RB.on = true;
  RB.x = c[0];
  RB.y = c[1];
  RB.acc = 0;
  document.body.classList.add('grabbing');
});

window.addEventListener('pointermove', function (e) {
  if (!RB.on) return;
  const c = toCanvas(e);
  const d = Math.hypot(c[0] - RB.x, c[1] - RB.y);
  if (d < 3) return;
  drawRub(RB.x, RB.y, c[0], c[1]);
  RB.acc += d;
  if (RB.acc > 170) {                     // 조금 문지를 때마다 쩍
    RB.acc = 0;
    popText(Math.random() < 0.5 ? '쩍' : '쩌억', c[0], c[1] - 40, true);
    play('rub', 0.6, rand(1.05, 1.35));
  }
  RB.x = c[0];
  RB.y = c[1];
});

window.addEventListener('pointerup', function () {
  if (!RB.on) return;
  RB.on = false;
  document.body.classList.remove('grabbing');
});

// 끈적하게 끌린 자국 (연필 결 3줄 + 군데군데 실)
function drawRub(ax, ay, bx, by) {
  const len = Math.hypot(bx - ax, by - ay) || 1;
  const nx = -(by - ay) / len, ny = (bx - ax) / len;
  rc.lineCap = 'round';
  for (let k = -1; k <= 1; k++) {
    const o = k * 9;
    rc.strokeStyle = 'rgba(45, 45, 45,' + (k ? 0.16 : 0.3) + ')';
    rc.lineWidth = k ? 1 : 1.6;
    rc.beginPath();
    rc.moveTo((ax + nx * o + rand(-1.5, 1.5)) * RES, (ay + ny * o + rand(-1.5, 1.5)) * RES);
    rc.lineTo((bx + nx * o + rand(-1.5, 1.5)) * RES, (by + ny * o + rand(-1.5, 1.5)) * RES);
    rc.stroke();
  }
  if (Math.random() < 0.25) {             // 늘어난 끈적이 실
    rc.strokeStyle = 'rgba(45, 45, 45, 0.22)';
    rc.lineWidth = 0.8;
    rc.beginPath();
    rc.moveTo(bx * RES, by * RES);
    rc.quadraticCurveTo((bx + nx * 18) * RES, (by + ny * 18 + 10) * RES, (bx - (bx - ax) * 0.6) * RES, (by - (by - ay) * 0.6 + 6) * RES);
    rc.stroke();
  }
  RB.alive = 3;
}

function updateRub(dt) {
  if (RB.alive <= 0) return;
  rc.globalCompositeOperation = 'destination-out';         // 자국이 서서히 마름
  rc.fillStyle = 'rgba(0,0,0,' + (dt * (RB.on ? 0.35 : 1.1)) + ')';
  rc.fillRect(0, 0, CW, CH);
  rc.globalCompositeOperation = 'source-over';
  if (!RB.on) {
    RB.alive -= dt;
    if (RB.alive <= 0) rc.clearRect(0, 0, CW, CH);
  }
}


/* =========================================================
   무위 · 인위 게이지 (연필로 그은 선)
   - 무위 : 꾹 누르는 만큼 황토색 선이 차오름
   - 인위 : 억지로 끈 만큼 검은 선이 차오름 (가만히 두면 천천히 줄어듦)
   ========================================================= */
const gMu = document.getElementById('gMu');
const gIn = document.getElementById('gIn');

// 그림 속 연필 선(gauge-line.png)에 색을 입혀 둠 (무위 = 황토색 / 인위 = 검정)
const lineImg = new Image();
lineImg.src = 'gauge-line.png';
const lineTint = {};

// gauge-line.png 를 못 찾으면 → 연필 느낌 선을 코드로 대신 그려서라도 보이게
lineImg.onerror = function () {
  const c = document.createElement('canvas');
  c.width = 546;
  c.height = 23;
  const g = c.getContext('2d');
  for (let k = 0; k < 3; k++) {
    g.strokeStyle = 'rgba(0,0,0,' + (k ? 0.4 : 0.9) + ')';
    g.lineWidth = k ? 1.5 : 4;
    g.beginPath();
    g.moveTo(2, 11.5 + rand(-1, 1));
    for (let x = 12; x <= 544; x += 12) g.lineTo(x, 11.5 + rand(-1.2, 1.2) + (k - 1) * 1.5);
    g.stroke();
  }
  buildGauge(c);
};

lineImg.onload = function () { buildGauge(lineImg); };

function buildGauge(src) {
  [['mu', '#BE8500'], ['in', '#111111']].forEach(function (c) {
    const t = document.createElement('canvas');
    t.width = src.width;
    t.height = src.height;
    const g = t.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = c[1];
    g.fillRect(0, 0, t.width, t.height);
    lineTint[c[0]] = t;
  });
  [gMu, gIn].forEach(function (box) {
    const cv = box.querySelector('canvas');
    cv.width = src.width;
    cv.height = src.height;
    box.v = -1;
  });
  updateGauge();
}

function setGauge(box, key, v) {
  box.querySelector('.gPct').textContent = Math.round(v * 100) + '%';
  const tint = lineTint[key];
  if (!tint || Math.abs(box.v - v) < 0.001) return;   // 변화 없으면 다시 안 그림
  box.v = v;
  const cv = box.querySelector('canvas');
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  g.globalAlpha = 0.16;                       // 아직 안 찬 부분 : 연하게
  g.drawImage(tint, 0, 0);
  g.globalAlpha = 1;                          // 찬 만큼만 진하게
  const w = Math.max(0, cv.width * v);
  if (w > 0) g.drawImage(tint, 0, 0, w, cv.height, 0, 0, w, cv.height);
}

function updateGauge() {
  setGauge(gMu, 'mu', MU.p);
  setGauge(gIn, 'in', Math.min(1, IN.effort / INWI_LIMIT));
}


/* =========================================================
   배경음 + 가만히 있어도 소품들이 가끔 들썩
   - 모기 : 윙~ 하고 몇 초 들렸다가 쉬고 (모기가 멀리 있으면 작게)
   - 담배 : 가끔 한 번씩
   - 바퀴벌레 : 움직이기 시작할 때 (위 바퀴벌레 코드에서)
   - 무위에 가까워질수록 모든 소리가 잠잠해짐
   ========================================================= */
let calmNow = 1;
const AMB = { smoke: rand(4, 8), roachAt: -99, idle: rand(IDLE_GAP[0], IDLE_GAP[1]) };
const MQ  = { audio: null, wait: 2, left: 0, age: 0 };

function updateAmbient(dt) {
  if (!started) return;

  // 모기 윙윙 (긴 파일에서 몇 초씩 잘라 들려줌)
  if (SOUNDS.mosquito) {
    if (!MQ.audio) MQ.audio = new Audio(SOUND_DIR + SOUNDS.mosquito);
    const a = MQ.audio;
    if (MQ.left > 0) {
      MQ.left -= dt;
      MQ.age += dt;
      const env = Math.max(0, Math.min(1, MQ.age / 0.4, MQ.left / 0.6));      // 스르르 커졌다 작아짐
      const near = 1 - Math.min(1, Math.hypot(M.x - W / 2, M.y - H / 2) / (W * 0.6)) * 0.7;
      a.volume = Math.max(0, Math.min(1, AMB_VOL.mosquito * env * near * calmNow));
      if (MQ.left <= 0) {
        a.pause();
        MQ.wait = rand(MOSQUITO_GAP[0], MOSQUITO_GAP[1]);
      }
    } else if (M.alive) {
      MQ.wait -= dt;
      if (MQ.wait <= 0) {
        const dur = a.duration || 60;
        a.currentTime = rand(0, Math.max(0, dur - 6));
        a.volume = 0;
        a.play().catch(function () {});
        MQ.left = rand(MOSQUITO_BUZZ[0], MOSQUITO_BUZZ[1]);
        MQ.age = 0;
      }
    }
  }

  // 담배 소리 가끔
  AMB.smoke -= dt;
  if (AMB.smoke <= 0) {
    play('smoke', AMB_VOL.smoke * calmNow);
    AMB.smoke = rand(SMOKE_GAP[0], SMOKE_GAP[1]);
  }

  // 소품들 가끔 들썩 (컵 · 캔 · 이불 중 하나)
  AMB.idle -= dt;
  if (AMB.idle <= 0) {
    AMB.idle = rand(IDLE_GAP[0], IDLE_GAP[1]);
    if (MU.p < 0.05 && !resultOpen && !endOpen) {
      const pick = Math.floor(rand(0, 3));
      if (pick === 0 && !drinking) restart(cupCut, 'wobble');
      if (pick === 1) restart(canCut, 'tilt');
      if (pick === 2) {
        room.classList.remove('heave');
        void room.offsetWidth;
        room.classList.add('heave');
        clearTimeout(hotBlanket.t);
        hotBlanket.t = setTimeout(function () { room.classList.remove('heave'); }, 1000);
      }
    }
  }
}


/* =========================================================
   가사가 노래 · 인터랙션에 반응
   - 노래가 그 줄을 부르면 : 줄 속 단어 반응 + 방 연출 (연기 진해짐 / 인물 혼자 쩍)
   - 가사 한 줄 누르면    : 노래가 그 부분으로 이동
   - 무위 진행           : 가사가 옅어지며 가라앉음
   - 인위로 끄는 중       : 가사가 덜덜
   ========================================================= */
let lastSongT = 0;

function lineTime(i) {
  if (LINE_TIMES[i] != null) return LINE_TIMES[i];
  const dur = song.duration || 180;
  const end = dur - AUTO_END;
  return AUTO_START + (end - AUTO_START) * i / Math.max(1, lineEls.length);
}

function fireWord(span) {
  restart(span, 'fire');
}

function fireLine(i) {
  const el = lineEls[i];
  if (!el) return;
  el.querySelectorAll('.kw').forEach(fireWord);
  const fx = el.dataset.fx;
  if (fx.indexOf('smoke') >= 0)  thickenSmoke();
  if (fx.indexOf('sticky') >= 0) setTimeout(autoJolt, 250);
}

function jumpTo(i) {
  if (!started || REC.on) return;
  const t = lineTime(i);
  song.currentTime = t;
  song.play().catch(function () {});
  lastSongT = t - 0.05;                   // 이동한 줄도 바로 반응하게
}

function updateSongFx() {
  const st = song.currentTime;
  if (song.paused || REC.on) { lastSongT = st; return; }
  if (st < lastSongT || st - lastSongT > 1.5) { lastSongT = st; return; }   // 되감기 · 건너뛰기
  for (let i = 0; i < lineEls.length; i++) {
    const t = lineTime(i);
    if (t > lastSongT && t <= st) fireLine(i);
  }
  lastSongT = st;
}

function updateLyricsMood() {
  const mu = smooth(0, 1, MU.p);
  const sh = (IN.active || IN.spring) ? Math.min(6, Math.hypot(IN.px, IN.py) / PULL_MAX * 6) : 0;
  [leftCol, rightCol].forEach(function (col) {
    col.style.setProperty('--mu', mu.toFixed(3));
    col.style.setProperty('--sh', sh.toFixed(2));
    col.classList.toggle('shiver', sh > 0.3);
  });
}


/* =========================================================
   결과 화면 (itsright.png / itswrong.png)
   - 무위 : 쿵! → 사라지면서 설명글(end.png) → 누르면 end2.png → 누르면 원래 방으로
   - 인위 : 쿵! → 사라지면서 설명글(itswrong2.png) → 누르면 원래 방으로
   ========================================================= */
const result    = document.getElementById('result');
const resultImg = document.getElementById('resultImg');
let resultOpen = false;

function showResult(kind) {
  if (resultOpen) return;
  resultOpen = true;
  G.on = false;
  stopMuwi();
  document.body.classList.remove('grabbing');

  resultImg.src = kind === 'right' ? 'itsright.png' : 'itswrong.png';
  resultImg.classList.remove('swap');
  result.className = kind + ' show';
  void result.offsetWidth;
  result.classList.add('in');
  play(kind);

  const stay = kind === 'right' ? STAY_RIGHT : STAY_WRONG;
  setTimeout(function () {
    if (kind === 'right') {
      // 무위 : 스르르 사라지면서 방 위에 설명글 (end.png → end2.png)
      closeResult();
      showEnd('right');
    } else {
      // 인위 : 화면 가득 그대로 → 다음 장(itswrong2.png)으로 바뀜 → 누르면 원래 방으로
      resultImg.classList.add('swap');      // 지금 그림 스르르 사라지고
      setTimeout(function () {
        resultImg.src = WRONG_NEXT;          // 다음 장으로 바꿔서
        resultImg.classList.remove('swap');  // 다시 스르르 나타남
        result.classList.add('wait');        // 이제 누르면 닫힘
        resultAt = performance.now();
      }, 450);
    }
  }, stay * 1000);
}

// 결과 화면 닫기 : 스르르 사라지고 원래 방으로
function closeResult() {
  result.classList.remove('in', 'wait');
  result.classList.add('out');
  setTimeout(function () {
    result.className = '';
    resultImg.classList.remove('swap');
    resultOpen = false;
    IN.effort = 0;
    stage.classList.remove('angry');
  }, 1400);
}

// 인위 두 번째 장(itswrong2.png)이 떠 있을 때 화면을 누르면 → 원래 방으로
let resultAt = 0;
result.addEventListener('click', function () {
  if (!result.classList.contains('wait') || performance.now() - resultAt < 1000) return;
  closeResult();
});


/* =========================================================
   무위 뒤 설명글 (end.png)
   - 방(장판만 남은 모습) 위에 반투명 막 + 설명 텍스트
   - 화면을 누르면 설명글이 사라지고, 장판이 내려가며 원래 방으로
   ========================================================= */
const endVeil = document.getElementById('endVeil');
let endOpen = false;
let endAt = 0;

const endText = document.getElementById('endText');
let endKind = '';
let endPage = 0;

function showEnd(kind) {
  endOpen = true;
  endKind = kind;
  endPage = 0;
  endAt = performance.now();
  endText.src = END_PAGES[kind][0];
  stage.classList.add('ending');            // 반투명 막 + 설명글 스르르
  document.body.classList.add('reading');   // 양옆 가사는 옅게
}

endVeil.addEventListener('click', function () {
  if (!endOpen || resultOpen || performance.now() - endAt < 1500) return;   // 다 뜨기 전엔 무시
  const pages = END_PAGES[endKind];

  // 다음 설명 페이지가 남아 있으면 → 한 장 더
  if (endPage < pages.length - 1) {
    endPage++;
    endAt = performance.now();
    endText.classList.add('swap');          // 지금 글씨 스르르 사라지고
    setTimeout(function () {
      endText.src = pages[endPage];         // 다음 페이지로 바꿔서
      endText.classList.remove('swap');     // 다시 스르르 나타남
    }, 450);
    return;
  }

  // 마지막 페이지였으면 → 원래 방으로
  endOpen = false;
  stage.classList.remove('ending');         // 설명글 스르르 사라짐
  document.body.classList.remove('reading');
  MU.done = false;
  MU.back = true;                           // (무위) 장판이 내려가며 다시 사람으로
});


/* =========================================================
   매 프레임 움직임
   ========================================================= */
let lastTime = 0;

function loop(now) {
  const realDt = Math.min(0.25, (now - lastTime) / 1000);   // 실제 흐른 시간 (무위 진행용)
  const dt = Math.min(0.05, realDt);
  lastTime = now;
  const t = now / 1000;

  // 무위에 가까워질수록 세상이 느려짐 (바퀴벌레, 모기도 잠잠)
  const calm = 1 - 0.85 * smooth(0, 1, MU.p);
  calmNow = 1 - 0.9 * smooth(0, 1, MU.p);       // 소리도 같이 잠잠

  updateGesture();
  updateRoach(dt * calm, t);
  updateMosquito(dt * calm, t);
  updateScratch(dt);
  updateMuwi(realDt);
  updateMuwiSound(realDt);
  updateInwi(dt);
  updateRub(dt);
  updateGauge();
  updateAmbient(dt);
  updateSongFx();
  updateLyricsMood();

  requestAnimationFrame(loop);
}

moveSprite(roach, R.x, R.y);
moveSprite(mosquito, M.x, M.y);

// 창 크기 바뀌면 피 자국 위치도 다시 맞추기
window.addEventListener('resize', function () {
  stains.forEach(function (pair) {
    pair.forEach(function (s) { moveSprite(s, s.x, s.y); });
  });
});


/* =========================================================
   가사
   ========================================================= */
const lineEls = [];   // 실제 가사 줄들 (빈 줄 제외), 노래 순서대로

function addLines(lines, col) {
  lines.forEach(function (text) {
    const div = document.createElement('div');
    if (text.trim() === '') {
      div.className = 'line gap';
      col.appendChild(div);
      return;
    }
    div.className = 'line';
    div.style.setProperty('--f', rand(0.4, 1.4).toFixed(2));   // 줄마다 가라앉는 정도가 조금씩 다르게

    // 반응할 단어는 따로 감싸기
    const fx = {};
    text.trim().split(/\s+/).forEach(function (word, i) {
      if (i) div.appendChild(document.createTextNode(' '));
      let kind = '';
      Object.keys(LYRIC_FX).forEach(function (k) {
        if (!kind && LYRIC_FX[k].some(function (w) { return word.indexOf(w) >= 0; })) kind = k;
      });
      if (kind) {
        const span = document.createElement('span');
        span.className = 'kw kw-' + kind;
        span.textContent = word;
        span.addEventListener('pointerenter', function () { fireWord(span); });
        div.appendChild(span);
        fx[kind] = true;
      } else {
        div.appendChild(document.createTextNode(word));
      }
    });
    div.dataset.fx = Object.keys(fx).join(' ');

    const idx = lineEls.length;
    div.addEventListener('click', function () {
      lineEls.forEach(function (l) { l.classList.remove('picked'); });
      div.classList.add('picked');             // 누른 줄은 굵게 남아 있음
      jumpTo(idx);
    });
    lineEls.push(div);
    col.appendChild(div);
  });
}

// 한 줄로 이어진 가사 → 띄어쓰기 두 칸은 문단, 나머지는 글자 수에 맞춰 줄나눔
function autoLines(text) {
  const out = [];
  text.trim().split(/\s{2,}/).forEach(function (para, p) {
    if (p > 0) out.push('');
    let line = '';
    para.trim().split(/\s+/).forEach(function (word) {
      if (line && (line + ' ' + word).length > LINE_LENGTH) {
        out.push(line);
        line = word;
      } else {
        line = line ? line + ' ' + word : word;
      }
    });
    if (line) out.push(line);
  });
  return out;
}

(function buildLyrics() {
  let raw = lyricsText.trim().includes('\n')
    ? lyricsText.split('\n')   // 직접 줄바꿈 해뒀으면 그대로 사용
    : autoLines(lyricsText);    // 한 줄로 이어져 있으면 자동으로 나눔
  while (raw.length && raw[0].trim() === '') raw.shift();
  while (raw.length && raw[raw.length - 1].trim() === '') raw.pop();

  // 빈 줄을 뺀 실제 가사 줄 수를 세서 정확히 반으로
  const total = raw.filter(function (l) { return l.trim() !== ''; }).length;
  const half  = Math.ceil(total / 2);

  let count = 0;
  let cut = raw.length;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].trim() !== '') count++;
    if (count === half) { cut = i + 1; break; }
  }

  const leftLines  = raw.slice(0, cut);
  const rightLines = raw.slice(cut);
  while (rightLines.length && rightLines[0].trim() === '') rightLines.shift();

  addLines(leftLines, leftCol);
  addLines(rightLines, rightCol);
})();

// 가사 전체가 화면 높이 안에 다 들어가게 글씨 크기 자동 맞춤
function fitLyrics() {
  const rows = Math.max(leftCol.children.length, rightCol.children.length, 1);
  const size = Math.min(18, (window.innerHeight * 0.9) / (rows * 1.85));
  leftCol.style.fontSize  = size + 'px';
  rightCol.style.fontSize = size + 'px';
}

fitLyrics();
window.addEventListener('resize', fitLyrics);


/* =========================================================
   E 키 : 이불 덮개 모양 직접 그리기
      1) E 누르기 → 덮개가 파랗게 보임
      2) 펼친 이불 테두리를 따라 한 바퀴 점을 콕콕 클릭 (Backspace = 마지막 점 지우기)
      3) Enter → 뜨는 창의 한 줄을 복사 → 위의 const BLANKET_COVER = ... 줄과 바꾸기
      (Esc = 취소)
   ========================================================= */
const editLayer = document.getElementById('editLayer');
let editPoints = [];

function clearDots() {
  editLayer.querySelectorAll('.dot').forEach(function (d) { d.remove(); });
}

function startEdit() {
  editPoints = [];
  clearDots();
  stage.classList.add('editing');
}

function endEdit(save) {
  stage.classList.remove('editing');
  clearDots();
  if (save && editPoints.length >= 3) {
    const line = 'const BLANKET_COVER = ' + JSON.stringify(editPoints) + ';';
    console.log(line);
    window.prompt('이 한 줄을 복사(⌘C)해서 코드의 BLANKET_COVER 줄과 바꿔주세요', line);
  } else {
    placeShape(blanketCover, BLANKET_COVER);   // 취소하면 원래 모양으로
  }
}

editLayer.addEventListener('click', function (e) {
  const r = stage.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / r.width  * W);
  const y = Math.round((e.clientY - r.top)  / r.height * H);
  editPoints.push([x, y]);

  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.style.left = pct(x, W);
  dot.style.top  = pct(y, H);
  editLayer.appendChild(dot);

  if (editPoints.length >= 3) placeShape(blanketCover, editPoints);   // 그리는 대로 바로 미리보기
});


/* =========================================================
   K 키 : 가사 타이밍 녹음
      1) 타이틀 누르고 방에 들어온 뒤 K → 노래가 처음부터 나옴
      2) 가사 한 줄이 시작될 때마다 스페이스바 (위 안내 상자에 다음 줄이 보임)
      3) 다 끝나면 Enter (마지막 줄까지 누르면 자동으로 끝남) / Esc = 취소
      4) 뜨는 창의 한 줄을 복사 → 위의 const LINE_TIMES = [] 줄과 통째로 바꾸기
   ========================================================= */
const recBox = document.getElementById('recBox');
const REC = { on: false, times: [] };

function showRec() {
  const n = REC.times.length;
  const next = lineEls[n] ? lineEls[n].textContent : '(끝)';
  recBox.innerHTML = '타이밍 녹음 중 ' + n + ' / ' + lineEls.length +
    ' — 가사 줄이 시작될 때마다 <b>스페이스바</b><br>다음 줄 : 「' + next + '」 · Enter 끝내기 · Esc 취소';
}

function startRec() {
  if (!started || !lineEls.length) return;
  REC.on = true;
  REC.times = [];
  song.currentTime = 0;
  song.play().catch(function () {});
  recBox.classList.add('on');
  showRec();
}

function finishRec(save) {
  REC.on = false;
  recBox.classList.remove('on');
  if (save && REC.times.length) {
    const line = 'const LINE_TIMES = ' + JSON.stringify(REC.times) + ';';
    console.log(line);
    window.prompt('이 한 줄을 복사(⌘C)해서 코드의 LINE_TIMES 줄과 바꿔주세요', line);
  }
}


/* =========================================================
   H 키 : 클릭 영역 보기/숨기기
   ========================================================= */
document.addEventListener('keydown', function (e) {
  const k = e.key.toLowerCase();

  // K 키 타이밍 녹음 중
  if (REC.on) {
    if (e.code === 'Space') {
      e.preventDefault();
      REC.times.push(Number(song.currentTime.toFixed(2)));
      showRec();
      if (REC.times.length >= lineEls.length) finishRec(true);
    }
    if (e.key === 'Enter')  finishRec(true);
    if (e.key === 'Escape') finishRec(false);
    return;
  }
  if (k === 'k' && !stage.classList.contains('editing')) { startRec(); return; }

  // E 키 그리기 모드
  if (stage.classList.contains('editing')) {
    if (e.key === 'Enter')  endEdit(true);
    if (e.key === 'Escape') endEdit(false);
    if (e.key === 'Backspace' && editPoints.length) {
      editPoints.pop();
      const dots = editLayer.querySelectorAll('.dot');
      dots[dots.length - 1].remove();
      if (editPoints.length >= 3) placeShape(blanketCover, editPoints);
    }
    return;
  }
  if (k === 'e') { startEdit(); return; }

  if (k === 'h') stage.classList.toggle('debug');
});
</script>
